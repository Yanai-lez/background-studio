name: בדיקת האתר החי
on:
  push:
    branches: [main]
    paths-ignore: ['qa-out/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: המתנה לפרסום הגרסה החדשה
        run: |
          WANT=$(grep -o "bg-studio-v[0-9]*" sw.js | head -1)
          for i in $(seq 1 30); do
            GOT=$(curl -s "https://yanai-lez.github.io/background-studio/sw.js?x=$RANDOM" | grep -o "bg-studio-v[0-9]*" | head -1)
            echo "want=$WANT live=$GOT"
            [ "$WANT" = "$GOT" ] && exit 0
            sleep 20
          done
          echo "הגרסה החדשה לא עלתה בזמן"; exit 1
      - run: npm i playwright@1.49.0 && npx playwright install --with-deps chromium
      - run: node qa/qa.js
      - name: שמירת הצילומים בענף qa-reports
        if: always()
        run: |
          git config user.name "qa-bot"; git config user.email "qa-bot@users.noreply.github.com"
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/rep && cp -r qa-out/* /tmp/rep/ 2>/dev/null || true
          git checkout --orphan qa-reports-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/rep/* . 2>/dev/null || true
          echo "$SHA $(date -u +%FT%TZ)" > LAST_RUN.txt
          git add -A && git commit -qm "QA $SHA"
          git push -f origin HEAD:qa-reports
